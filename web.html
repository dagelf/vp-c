<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VP Process Manager</title>
    <style>
        :root {
            --bg: #ffffff;
            --fg: #09090b;
            --card: #ffffff;
            --card-fg: #09090b;
            --primary: #18181b;
            --primary-fg: #fafafa;
            --muted: #f4f4f5;
            --muted-fg: #71717a;
            --border: #e4e4e7;
            --input: #e4e4e7;
            --ring: #18181b;
            --radius: 0.5rem;

            --success-bg: #dcfce7;
            --success-text: #15803d;
            --warning-bg: #fef9c3;
            --warning-text: #a16207;
            --error-bg: #fee2e2;
            --error-text: #b91c1c;
            --neutral-bg: #f4f4f5;
            --neutral-text: #52525b;

            --editor-bg: #fafafa;
        }

        .dark {
            --bg: #09090b;
            --fg: #fafafa;
            --card: #18181b;
            --card-fg: #fafafa;
            --primary: #fafafa;
            --primary-fg: #18181b;
            --muted: #27272a;
            --muted-fg: #a1a1aa;
            --border: #27272a;
            --input: #27272a;
            --ring: #d4d4d8;

            --success-bg: #052e16;
            --success-text: #4ade80;
            --warning-bg: #422006;
            --warning-text: #facc15;
            --error-bg: #450a0a;
            --error-text: #f87171;
            --neutral-bg: #27272a;
            --neutral-text: #a1a1aa;

            --editor-bg: #000000;
        }

        * {
            box-sizing: border-box;
            border-width: 0;
            border-style: solid;
            border-color: var(--border);
        }

        body {
            margin: 0;
            font-family: -apple-system, system-ui, sans-serif;
            background: var(--bg);
            color: var(--fg);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Layout */
        .flex {
            display: flex;
        }

        .flex-col {
            flex-direction: column;
        }

        .items-center {
            align-items: center;
        }

        .justify-between {
            justify-content: space-between;
        }

        .flex-1 {
            flex: 1;
            min-height: 0;
        }

        .gap-2 {
            gap: 0.5rem;
        }

        .gap-4 {
            gap: 1rem;
        }

        .p-4 {
            padding: 1rem;
        }

        .p-6 {
            padding: 1.5rem;
        }

        .mb-4 {
            margin-bottom: 1rem;
        }

        .mb-6 {
            margin-bottom: 1.5rem;
        }

        .mr-2 {
            margin-right: 0.5rem;
        }

        .hidden {
            display: none;
        }

        .block {
            display: block;
        }

        .h-full {
            height: 100%;
        }

        .w-full {
            width: 100%;
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(292px, 1fr));
            gap: 1rem;
        }

        /* Typography */
        h2,
        h3,
        p {
            margin: 0;
        }

        .text-xl {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .text-lg {
            font-size: 1.125rem;
            font-weight: 600;
        }

        .text-sm {
            font-size: 0.875rem;
        }

        .text-xs {
            font-size: 0.75rem;
        }

        .font-mono {
            font-family: monospace;
        }

        .font-semibold {
            font-weight: 600;
        }

        .text-muted {
            color: var(--muted-fg);
        }

        /* Components */
        header {
            height: 3.5rem;
            border-bottom-width: 1px;
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
            background: var(--bg);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 2.25rem;
            padding: 0 1rem;
            border-radius: var(--radius);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
            background: transparent;
            color: var(--fg);
            border: 1px solid transparent;
        }

        .btn:hover {
            opacity: 0.8;
        }

        .btn-primary {
            background: var(--primary);
            color: var(--primary-fg);
        }

        .btn-outline {
            border-color: var(--input);
        }

        .btn-icon {
            width: 2.25rem;
            padding: 0;
        }

        .btn-sm {
            height: 2rem;
            font-size: 0.75rem;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .card-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            background: var(--muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-body {
            padding: 1.25rem 1rem;
            flex: 1;
            overflow: auto;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .badge {
            padding: 0.125rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-success {
            background: var(--success-bg);
            color: var(--success-text);
        }

        .badge-warning {
            background: var(--warning-bg);
            color: var(--warning-text);
        }

        .badge-error {
            background: var(--error-bg);
            color: var(--error-text);
        }

        .badge-neutral {
            background: var(--neutral-bg);
            color: var(--neutral-text);
        }

        .badge-stale {
            background: var(--neutral-bg);
            color: var(--muted-fg);
        }

        .input {
            height: 2.25rem;
            padding: 0 0.75rem;
            border-radius: var(--radius);
            border: 1px solid var(--input);
            background: var(--bg);
            color: var(--fg);
            font-size: 0.875rem;
        }

        .tab-nav {
            display: flex;
            gap: 0.25rem;
            background: var(--muted);
            padding: 0.25rem;
            border-radius: var(--radius);
        }

        .tab-btn {
            flex: 1;
            padding: 0.375rem;
            border-radius: calc(var(--radius) - 2px);
            text-align: center;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--muted-fg);
            border: none;
            background: transparent;
        }

        .tab-btn.active {
            background: var(--bg);
            color: var(--fg);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .code-block {
            background: var(--muted);
            padding: 0.5rem;
            border-radius: var(--radius);
            font-family: monospace;
            font-size: 0.75rem;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .status-dot {
            width: 0.5rem;
            height: 0.5rem;
            border-radius: 50%;
            display: inline-block;
            margin-right: 0.5rem;
        }

        .status-dot.live {
            background: var(--success-text);
            box-shadow: 0 0 4px var(--success-text);
        }

        .status-dot.stale {
            background: var(--warning-text);
        }

        /* Refresh Timer Hover Effect */
        .freshness-time {
            display: none;
        }

        .freshness-container:hover .freshness-time {
            display: inline;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal {
            background: var(--card);
            color: var(--card-fg);
            padding: 1.5rem;
            border-radius: var(--radius);
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .modal-header {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .modal-body {
            margin-bottom: 1.5rem;
            overflow-y: auto;
            flex: 1;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
        }

        /* Config Editor specific */
        .editor-wrapper {
            display: flex;
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .line-numbers {
            width: 3rem;
            padding: 1rem 0.5rem;
            text-align: right;
            background: var(--muted);
            color: var(--muted-fg);
            font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
            font-size: 0.875rem;
            line-height: 1.5;
            overflow: hidden;
            user-select: none;
            border-right: 1px solid var(--border);
        }

        #config-editor {
            flex: 1;
            padding: 1rem;
            background-color: var(--editor-bg);
            color: var(--fg);
            font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
            font-size: 0.875rem;
            line-height: 1.5;
            border: none;
            resize: none;
            white-space: pre;
            overflow: auto;
        }

        #config-editor:focus {
            outline: none;
        }

        g

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--muted-fg);
            opacity: 0.5;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <header>
        <div class="flex items-center gap-2 flex-1">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 19h8"></path>
                <path d="m4 17 6-6-6-6"></path>
            </svg>
            <span class="text-lg">VP Manager</span>
            <span id="filter-indicator" style="display: none; color: var(--primary); font-weight: 600;"></span>
        </div>

        <div class="flex items-center gap-2">
            <button onclick="showSettings()" class="btn btn-outline btn-icon" title="Settings">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            </button>
            <button onclick="toggleTheme()" class="btn btn-outline btn-icon" title="Toggle Theme">
                <svg id="theme-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round"></svg>
            </button>
        </div>
    </header>

    <main class="flex-1 flex flex-col p-6 overflow-hidden">
        <div class="mb-6 flex justify-center">
            <div class="tab-nav" style="width: 100%; max-width: 700px;">
                <button onclick="setTab('instances')" class="tab-btn active" data-tab="instances">Instances</button>
                <button onclick="setTab('discover')" class="tab-btn" data-tab="discover">Processes</button>
                <button onclick="setTab('templates')" class="tab-btn" data-tab="templates">Templates</button>
                <button onclick="setTab('resources')" class="tab-btn" data-tab="resources">Resources</button>
                <button onclick="setTab('types')" class="tab-btn" data-tab="types">Types</button>
                <button onclick="setTab('config')" class="tab-btn" data-tab="config">Config</button>
            </div>
        </div>

        <!-- Instances -->
        <div id="tab-instances" class="tab-pane flex-1 flex flex-col overflow-hidden">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-2">
                    <h2 class="text-xl">Managed Instances</h2>
                    <div class="flex items-center text-sm text-muted ml-4 freshness-container cursor-help">
                        <span id="status-instances" class="status-dot stale"></span>
                        <span id="label-instances">Loading...</span>
                        <span id="time-instances" class="freshness-time"></span>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <label class="flex items-center gap-2 text-sm cursor-pointer">
                        <input type="checkbox" id="auto-refresh" checked> Auto
                    </label>
                    <button onclick="if(!state.waitingForAuth) loadInstances()" class="btn btn-outline btn-sm">Refresh</button>
                </div>
            </div>
            <div id="list-instances" class="grid overflow-auto p-1"></div>
        </div>

        <!-- Discovery -->
        <div id="tab-discover" class="tab-pane hidden flex-1 flex flex-col overflow-hidden">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-2">
                    <h2 class="text-xl">System Processes</h2>
                    <div class="flex items-center text-sm text-muted ml-4 freshness-container cursor-help">
                        <span id="status-discover" class="status-dot stale"></span>
                        <span id="label-discover">Loading...</span>
                        <span id="time-discover" class="freshness-time"></span>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <label class="flex items-center gap-2 text-sm cursor-pointer">
                        <input type="checkbox" id="filter-ports" onchange="renderDiscovery()"> Ports Only
                    </label>
                    <label class="flex items-center gap-2 text-sm cursor-pointer">
                        <input type="checkbox" id="filter-toplevel" onchange="renderDiscovery()"> Top-Level Only
                    </label>
                    <label class="flex items-center gap-2 text-sm cursor-pointer">
                        <input type="checkbox" id="show-details" onchange="renderDiscovery()"> Show Details
                    </label>
                    <button onclick="discoverProcesses()" class="btn btn-outline btn-sm">Scan</button>
                </div>
            </div>
            <div id="list-discover" class="grid overflow-auto p-1"></div>
        </div>

        <!-- Templates -->
        <div id="tab-templates" class="tab-pane hidden flex-1 overflow-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl">Templates</h2>
                <button onclick="addTemplate()" class="btn btn-outline btn-sm">Add JSON</button>
            </div>
            <div id="list-templates" class="grid"></div>
        </div>

        <!-- Resources -->
        <div id="tab-resources" class="tab-pane hidden flex-1 overflow-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl">Resources</h2>
                <button onclick="addResourceType()" class="btn btn-outline btn-sm">Add Type</button>
            </div>
            <div id="list-resources" class="grid"></div>
        </div>

        <!-- Resource Types -->
        <div id="tab-types" class="tab-pane hidden flex-1 overflow-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl">Resource Types</h2>
                <button onclick="addResourceType()" class="btn btn-outline btn-sm">Add Type</button>
            </div>
            <div id="list-types" class="grid"></div>
        </div>

        <!-- Config -->
        <div id="tab-config" class="tab-pane hidden flex-1 flex flex-col overflow-hidden">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl">Configuration</h2>
                <div class="flex gap-2">
                    <button onclick="loadConfig()" class="btn btn-outline btn-sm">Reload</button>
                    <button onclick="saveConfig()" class="btn btn-primary btn-sm">Save</button>
                </div>
            </div>
            <div class="card flex-1 flex flex-col overflow-hidden">
                <div class="editor-wrapper">
                    <div id="line-numbers" class="line-numbers">1</div>
                    <textarea id="config-editor" class="w-full" spellcheck="false" oninput="updateLineNumbers()"
                        onscroll="syncScroll()" onkeydown="handleTab(event)"></textarea>
                </div>
            </div>
            <div id="config-msg" class="mt-2 text-sm hidden"></div>
        </div>
    </main>

    <!-- Generic Modal -->
    <div id="modal-overlay" class="modal-overlay" onclick="if(event.target===this) closeModal()">
        <div class="modal">
            <div id="modal-header" class="modal-header"></div>
            <div id="modal-body" class="modal-body"></div>
            <div id="modal-footer" class="modal-footer">
                <button onclick="closeModal()" class="btn btn-outline">Close</button>
            </div>
        </div>
    </div>

    <script>
        // --- Configuration ---
        // Determine source host (where this page was loaded from)
        const sourceHost = window.location.origin;

        const config = {
            sourceHost: sourceHost,
            sourceApiKey: localStorage.getItem('vp-source-api-key') || '',
            targetHost: localStorage.getItem('vp-target-host') || window.location.origin,
            targetApiKey: localStorage.getItem('vp-target-api-key') || '',
            host: localStorage.getItem('vp-host') || window.location.hostname
        };

        function saveConfigToLocalStorage() {
            localStorage.setItem('vp-source-api-key', config.sourceApiKey);
            localStorage.setItem('vp-target-host', config.targetHost);
            localStorage.setItem('vp-target-api-key', config.targetApiKey);
            localStorage.setItem('vp-host', config.host);
        }

        function showSettings() {
            const html = `
                <div class="flex flex-col gap-4">
                    <div class="p-3 bg-muted rounded">
                        <div class="text-sm font-bold mb-2">Source Host (Current Server)</div>
                        <div class="text-xs text-muted mb-2">${config.sourceHost}</div>
                        <label class="block text-xs font-semibold mb-1">API Key</label>
                        <input type="password" id="setting-source-key" class="input w-full mb-2" value="${config.sourceApiKey}" placeholder="Enter source API key">
                        <p class="text-xs text-muted mb-2">For reading templates & instances</p>
                        <label class="block text-xs font-semibold mb-1">\${host} Variable</label>
                        <input type="text" id="setting-host-var" class="input w-full" value="${config.host}" placeholder="${window.location.hostname}">
                        <p class="text-xs text-muted mt-1">Hostname/IP for \${host} in commands</p>
                    </div>
                    <div class="p-3 bg-muted rounded">
                        <label class="block text-sm font-bold mb-2">Target Host (For Launching)</label>
                        <input type="text" id="setting-target-host" class="input w-full mb-2" value="${config.targetHost}" placeholder="http://127.0.0.1:8080">
                        <label class="block text-xs font-semibold mb-1">API Key</label>
                        <input type="password" id="setting-target-key" class="input w-full" value="${config.targetApiKey}" placeholder="Enter target API key">
                        <p class="text-xs text-muted mt-1">Where instances will be launched</p>
                    </div>
                </div>
            `;

            // If waiting for auth, don't show Cancel - user must enter valid credentials
            const buttons = state.waitingForAuth ?
                [{ text: 'Save', class: 'btn-primary', onclick: 'saveSettings()' }] :
                [{ text: 'Cancel', class: 'btn-outline', onclick: 'closeModal()' },
                 { text: 'Save', class: 'btn-primary', onclick: 'saveSettings()' }];

            showModal('Settings', html, buttons);
        }

        async function saveSettings() {
            config.sourceApiKey = document.getElementById('setting-source-key').value.trim();
            const targetHostInput = document.getElementById('setting-target-host');
            const targetKeyInput = document.getElementById('setting-target-key');
            const hostVarInput = document.getElementById('setting-host-var');

            config.targetHost = targetHostInput ? targetHostInput.value.trim() : config.targetHost;
            config.targetApiKey = targetKeyInput ? targetKeyInput.value.trim() : config.targetApiKey;
            config.host = hostVarInput ? hostVarInput.value.trim() : config.host;

            // If host variable is empty, default to source hostname
            if (!config.host) {
                config.host = window.location.hostname;
            }

            // If source and target are same host, use same key
            if (config.sourceHost === config.targetHost) {
                config.targetApiKey = config.sourceApiKey;
            }

            saveConfigToLocalStorage();

            // Test if the new credentials work
            try {
                const testResult = await fetch(config.sourceHost + '/api/instances', {
                    headers: config.sourceApiKey ? { 'X-VP-Key': config.sourceApiKey } : {}
                });

                if (testResult.ok) {
                    // Auth succeeded - close modal and proceed
                    closeModal();
                    state.waitingForAuth = false;
                    loadInstances();
                } else if (testResult.status === 401) {
                    // Auth failed - show error but keep modal open
                    alert('API key rejected. Please enter a valid key.');
                } else {
                    // Other error (500, 404, etc) - close modal, might be temporary
                    closeModal();
                    state.waitingForAuth = false;
                    rerenderCurrentTab();
                }
            } catch (e) {
                // Network error - close modal, might be temporary
                closeModal();
                state.waitingForAuth = false;
                rerenderCurrentTab();
            }
        }

        // Check if we need to prompt for API key on first use
        function checkInitialSetup() {
            // Try a simple API call to source host
            fetch(config.sourceHost + '/api/instances', {
                headers: config.sourceApiKey ? { 'X-VP-Key': config.sourceApiKey } : {}
            }).then(res => {
                if (res.status === 401) {
                    // Need API key
                    if (!state.waitingForAuth) {
                        state.waitingForAuth = true;
                        showSettings();
                    }
                } else if (res.ok) {
                    // Auth succeeded - load instances
                    loadInstances();
                }
            }).catch(err => {
                // Connection error - might need to configure
                if (!config.sourceApiKey && !state.waitingForAuth) {
                    state.waitingForAuth = true;
                    showSettings();
                }
            });
        }

        // --- View (HTML Generation) ---
        const View = {
            instanceCard: (i, isStale) => {
                const running = i.status === 'running';
                let badge = 'badge-neutral';
                if (running) badge = isStale ? 'badge-stale' : 'badge-success';
                else if (i.status === 'error') badge = 'badge-error';

                return `
                <div class="card">
                    <div class="card-header">
                        <div class="flex items-center gap-2">
                            <button onclick="showLaunchers('${i.id}', event)" class="font-semibold btn btn-sm btn-outline border-0 hover:bg-neutral-100 dark:hover:bg-neutral-800" title="Launchers">${i.name}</button>
                            <span class="badge ${badge}">${i.status}</span>
                        </div>
                        <div class="flex gap-1">
                            ${running ?
                        `<button onclick="apiAction('stop', '${i.id}')" class="btn btn-outline btn-icon" title="Stop">■</button>` :
                        `<button onclick="apiAction('restart', '${i.id}')" class="btn btn-outline btn-icon" title="Start">▶</button>`
                    }
                            <button onclick="addAsTemplate('${i.id}')" class="btn btn-outline btn-icon" title="Save as Template">+</button>
                            <button onclick="apiAction('delete', '${i.id}')" class="btn btn-outline btn-icon text-error-text" title="Delete">✕</button>
                            ${i.action ? `<button onclick="window.open('${i.action}')" class="btn btn-primary btn-icon">↗</button>` : ''}
                        </div>
                    </div>
                    <div class="card-body text-sm">
                        <div class="flex justify-between">
                            <span class="text-muted">PID: ${i.pid || '-'}</span>
                            <span class="text-muted">CPU: ${formatTime(i.cputime)}</span>
                        </div>
                        <div class="code-block">${i.command}</div>
                        <div class="flex flex-wrap gap-1">
                            ${Object.entries(i.resources || {}).map(([k, v]) => `<span class="badge badge-neutral">${k}=${v}</span>`).join('')}
                        </div>
                    </div>
                </div>`;
            },

            discoveryCard: (p, showDetails) => `
                <div class="card">
                    <div class="card-header">
                        <span class="font-semibold truncate">${p.name || 'Unknown'}${p.isTopLevel ? ' 🔝' : ''}</span>
                        <div class="flex gap-2">
                            <button onclick="stopProcess(${p.pid})" class="btn btn-outline btn-sm text-warning-text">Stop</button>
                            <button onclick="monitorProcess(${p.pid}, '${escape(p.command)}')" class="btn btn-primary btn-sm">Add</button>
                        </div>
                    </div>
                    <div class="card-body text-sm">
                        <div class="flex justify-between">
                            <span class="text-muted">PID: ${p.pid}</span>
                            <span class="text-muted">Ports: ${p.ports?.join(',') || '-'}</span>
                        </div>
                        ${showDetails ? `
                        <div class="flex justify-between mt-2">
                            <span class="text-muted">Parent: ${p.parent || '-'}</span>
                            <span class="text-muted">Memory: ${p.memory ? (p.memory / 1024).toFixed(1) + ' MB' : '-'}</span>
                        </div>
                        <div class="text-muted mt-2">CWD: ${p.cwd || '-'}</div>
                        ` : ''}
                        <div class="code-block">${p.command}</div>
                    </div>
                </div>`,

            templateCard: (t) => `
                <div class="card">
                    <div class="card-header">
                        <span class="font-semibold">${t.label || t.id}</span>
                        <button onclick="startTemplate('${t.id}')" class="btn btn-primary btn-sm">Launch</button>
                    </div>
                    <div class="card-body">
                        <div class="code-block">${t.command}</div>
                    </div>
                </div>`,

            resourceCard: (type, list) => `
                <div class="card">
                    <div class="card-header"><span class="font-semibold">${type}</span></div>
                    <div class="card-body flex flex-col gap-2">
                        ${list.map(r => `<div class="flex justify-between text-sm border p-2 rounded"><span>${r.value}</span><span class="text-muted">→ ${r.owner}</span></div>`).join('')}
                    </div>
                </div>`,

            typeCard: (t) => `
                <div class="card">
                    <div class="card-header"><span class="font-semibold">${t.name}</span></div>
                    <div class="card-body">
                        <div class="mb-2"><span class="text-muted">Check:</span> <span class="code-block" style="display:inline;padding:0.2rem">${t.check || '-'}</span></div>
                        <div class="mb-2"><span class="text-muted">Counter:</span> ${t.counter ? 'Yes' : 'No'}</div>
                        ${t.counter ? `<div><span class="text-muted">Range:</span> ${t.start} - ${t.end}</div>` : ''}
                    </div>
                </div>`,

            empty: (msg) => `<div class="p-4 text-center text-muted">${msg}</div>`
        };

        // --- State ---
        const state = {
            instances: {},
            templates: {},
            resources: {},
            types: {},
            discovery: [],
            lastUpdate: { instances: 0, discover: 0 },
            activeTab: 'instances',
            filter: '',
            waitingForAuth: false  // Track if we're waiting for user to enter credentials
        };

        // --- Controller / Logic ---

        // Universal Filtering
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.ctrlKey || e.altKey || e.metaKey) return;

            if (e.key === 'Escape') {
                state.filter = '';
            } else if (e.key === 'Backspace') {
                state.filter = state.filter.slice(0, -1);
            } else if (e.key.length === 1) {
                state.filter += e.key;
            } else {
                return;
            }

            // Update filter indicator
            const filterIndicator = document.getElementById('filter-indicator');
            if (state.filter) {
                filterIndicator.textContent = `(filter: ${state.filter})`;
                filterIndicator.style.display = 'inline';
            } else {
                filterIndicator.style.display = 'none';
            }

            rerenderCurrentTab();
        });


        function rerenderCurrentTab() {
            if (state.activeTab === 'instances') renderInstances();
            else if (state.activeTab === 'discover') renderDiscovery();
            else if (state.activeTab === 'templates') renderTemplates();
            else if (state.activeTab === 'resources') renderResources();
            else if (state.activeTab === 'types') renderTypes();
        }

        function filterItems(items, key = 'name') {
            if (!state.filter) return items;
            const q = state.filter.toLowerCase();
            return items.filter(i => (i[key] || '').toLowerCase().includes(q));
        }

        // Theme
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeIcon();
        }
        function updateThemeIcon() {
            const isDark = document.documentElement.classList.contains('dark');
            const icon = document.getElementById('theme-icon');
            if (isDark) icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
            else icon.innerHTML = '<circle cx="12" cy="12" r="5"/><path d="M12 1v2"/><path d="M12 21v2"/><path d="M4.22 4.22l1.42 1.42"/><path d="M18.36 18.36l1.42 1.42"/><path d="M1 12h2"/><path d="M21 12h2"/><path d="M4.22 19.78l1.42-1.42"/><path d="M18.36 5.64l1.42-1.42"/>';
        }
        if (localStorage.theme === 'dark' || (!localStorage.theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
        updateThemeIcon();

        // Tabs
        function setTab(tab) {
            state.activeTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
            document.querySelectorAll('.tab-pane').forEach(p => p.classList.toggle('hidden', p.id !== `tab-${tab}`));

            // Clear filter on tab change? User said "universally on all pages", so maybe keep it?
            // "universally on all pages with cards" implies the filter persists.
            rerenderCurrentTab();

            if (tab === 'instances') loadInstances();
            else if (tab === 'discover') discoverProcesses();
            else if (tab === 'templates') loadTemplates();
            else if (tab === 'resources') loadResources();
            else if (tab === 'types') loadResourceTypes();
            else if (tab === 'config') loadConfig();
        }

        // API - with dual-host support
        // Launch operations go to target host, everything else goes to source host
        async function fetchAPI(endpoint, method = 'GET', body = null) {
            try {
                // Determine if this is a launch operation
                const isLaunchOperation = (
                    endpoint === '/api/instances' && method === 'POST' &&
                    body && (body.action === 'start' || body.template)
                ) || endpoint === '/api/preview-resources'
                  || endpoint === '/api/execute-action';

                // Choose host and key based on operation
                const host = isLaunchOperation ? config.targetHost : config.sourceHost;
                const apiKey = isLaunchOperation ? config.targetApiKey : config.sourceApiKey;

                const url = host + endpoint;
                const opts = {
                    method,
                    headers: {
                        'Content-Type': 'application/json'
                    }
                };

                // Add API key if configured
                if (apiKey) {
                    opts.headers['X-VP-Key'] = apiKey;
                }

                if (body) opts.body = JSON.stringify(body);
                const res = await fetch(url, opts);
                if (res.status === 401) {
                    // Unauthorized - prompt for API key (only once)
                    if (!state.waitingForAuth) {
                        state.waitingForAuth = true;
                        showSettings();
                    }
                    throw new Error('Unauthorized - API key required');
                }
                if (!res.ok) throw new Error(await res.text());
                return await res.json();
            } catch (e) {
                console.error(e);
                return null;
            }
        }

        async function loadInstances() {
            const data = await fetchAPI('/api/instances');
            if (data) {
                state.instances = data;
                state.lastUpdate.instances = Date.now();
                renderInstances();
            }
        }

        async function discoverProcesses() {
            const data = await fetchAPI('/api/discover');
            if (data) {
                // Process Tree Logic
                const shells = ['bash', 'zsh', 'sh', 'fish', 'dash', 'ksh', 'tcsh', 'csh'];
                const processMap = {};
                const childrenMap = {};

                data.forEach(p => {
                    processMap[p.pid] = p;
                    p.isTopLevel = false;
                    p.allPorts = new Set(p.ports || []);
                    if (!childrenMap[p.ppid]) childrenMap[p.ppid] = [];
                    childrenMap[p.ppid].push(p);
                });

                data.forEach(p => {
                    const parent = processMap[p.ppid];
                    if (parent && shells.includes(parent.name)) {
                        p.isTopLevel = true;
                        // Aggregate ports
                        const agg = (proc) => {
                            (childrenMap[proc.pid] || []).forEach(child => {
                                (child.ports || []).forEach(port => p.allPorts.add(port));
                                agg(child);
                            });
                        };
                        agg(p);
                        p.ports = Array.from(p.allPorts);
                    }
                });

                state.discovery = data;
                state.lastUpdate.discover = Date.now();
                renderDiscovery();
            }
        }

        async function loadTemplates() {
            state.templates = await fetchAPI('/api/templates') || {};
            renderTemplates();
        }

        async function loadResources() {
            state.resources = await fetchAPI('/api/resources') || {};
            renderResources();
        }

        async function loadResourceTypes() {
            state.types = await fetchAPI('/api/resource-types') || {};
            renderTypes();
        }

        async function loadConfig() {
            const cfg = await fetchAPI('/api/config');
            const editor = document.getElementById('config-editor');
            editor.value = JSON.stringify(cfg, null, 2);
            updateLineNumbers();
        }

        async function saveConfig() {
            try {
                const json = document.getElementById('config-editor').value;
                JSON.parse(json); // Validate
                await fetchAPI('/api/config', 'POST', JSON.parse(json));
                showMsg('Saved!', 'success');
            } catch (e) {
                showMsg(e.message, 'error');
                highlightErrorLine(e.message);
            }
        }

        function highlightErrorLine(msg) {
            // Try to extract line number from error message
            // V8 JSON.parse error format: "Unexpected token } in JSON at position 123"
            // We need to convert position to line number

            const match = msg.match(/at position (\d+)/);
            if (match) {
                const pos = parseInt(match[1]);
                const text = document.getElementById('config-editor').value;
                const line = text.substring(0, pos).split('\n').length;
                scrollToLine(line);
            } else {
                // Fallback: check for "line X"
                const lineMatch = msg.match(/line (\d+)/i);
                if (lineMatch) {
                    scrollToLine(parseInt(lineMatch[1]));
                }
            }
        }

        function scrollToLine(line) {
            const editor = document.getElementById('config-editor');
            const lineHeight = 21; // 1.5 * 14px (0.875rem) approx
            // Better to calculate dynamically if possible, but fixed is okay for monospace

            // Scroll to line
            editor.scrollTop = (line - 1) * lineHeight - (editor.clientHeight / 2);

            // Highlight (select) the line
            const lines = editor.value.split('\n');
            if (line > 0 && line <= lines.length) {
                let start = 0;
                for (let i = 0; i < line - 1; i++) {
                    start += lines[i].length + 1; // +1 for newline
                }
                const end = start + lines[line - 1].length;
                editor.focus();
                editor.setSelectionRange(start, end);
            }
        }

        function updateLineNumbers() {
            const editor = document.getElementById('config-editor');
            const lines = editor.value.split('\n').length;
            document.getElementById('line-numbers').innerHTML = Array(lines).fill(0).map((_, i) => i + 1).join('<br>');
        }

        function syncScroll() {
            const editor = document.getElementById('config-editor');
            document.getElementById('line-numbers').scrollTop = editor.scrollTop;
        }

        function handleTab(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = e.target.selectionStart;
                const end = e.target.selectionEnd;
                e.target.value = e.target.value.substring(0, start) + '  ' + e.target.value.substring(end);
                e.target.selectionStart = e.target.selectionEnd = start + 2;
                updateLineNumbers(); // In case of line wrap change? No, but good practice
            }
        }

        function showMsg(msg, type) {
            const el = document.getElementById('config-msg');
            el.textContent = msg;
            el.className = `mt-2 text-sm block ${type === 'error' ? 'text-error-text' : 'text-success-text'}`;
            setTimeout(() => el.classList.add('hidden'), 3000);
        }

        // Rendering Calls
        function renderInstances() {
            const list = document.getElementById('list-instances');
            const age = Date.now() - state.lastUpdate.instances;
            const isStale = age > 6000;

            let items = Object.values(state.instances);
            items = filterItems(items, 'name');

            if (items.length === 0) list.innerHTML = View.empty('No instances');
            else list.innerHTML = items.map(i => View.instanceCard(i, isStale)).join('');
        }

        function renderDiscovery() {
            const list = document.getElementById('list-discover');
            const portsOnly = document.getElementById('filter-ports').checked;
            const topLevelOnly = document.getElementById('filter-toplevel').checked;
            const showDetails = document.getElementById('show-details').checked;

            let items = state.discovery.filter(p => {
                if (portsOnly && (!p.ports || p.ports.length === 0)) return false;
                if (topLevelOnly && !p.isTopLevel) return false;
                return true;
            });
            items = filterItems(items, 'name');

            if (items.length === 0) list.innerHTML = View.empty('No processes found');
            else list.innerHTML = items.map(p => View.discoveryCard(p, showDetails)).join('');
        }

        function renderTemplates() {
            let items = Object.values(state.templates);
            items = filterItems(items, 'id'); // Filter by ID/Label
            const list = document.getElementById('list-templates');
            if (items.length === 0) list.innerHTML = View.empty('No templates');
            else list.innerHTML = items.map(t => View.templateCard(t)).join('');
        }

        function renderResources() {
            // Resources are grouped by type, filtering is tricky. 
            // We'll filter the inner items.
            const list = document.getElementById('list-resources');
            const q = state.filter.toLowerCase();

            const html = Object.entries(state.resources).map(([type, l]) => {
                const filteredList = state.filter ? l.filter(r => r.value.toLowerCase().includes(q)) : l;
                if (filteredList.length === 0) return '';
                return View.resourceCard(type, filteredList);
            }).join('');

            list.innerHTML = html || View.empty('No resources');
        }

        function renderTypes() {
            let items = Object.values(state.types);
            items = filterItems(items, 'name');
            const list = document.getElementById('list-types');
            if (items.length === 0) list.innerHTML = View.empty('No types');
            else list.innerHTML = items.map(t => View.typeCard(t)).join('');
        }

        // Actions
        async function apiAction(action, id) {
            if (action === 'delete') {
                // Check if instance is running
                const instance = state.instances[id];
                if (instance && instance.status === 'running') {
                    if (!confirm('Instance is running. Stop it first?')) return;
                    await fetchAPI('/api/instances', 'POST', { action: 'stop', instance_id: id });
                }
                if (!confirm('Delete this instance?')) return;
            }
            await fetchAPI('/api/instances', 'POST', { action, instance_id: id });
            loadInstances();
        }

        async function startTemplate(id) {
            const t = state.templates[id];
            showLaunchDialog(t);
        }

        async function showLaunchDialog(template) {
            // Get default instance name
            const defaultName = template.id + '-instance';

            // Preview resource allocation
            let previewedResources = {};
            if (template.resources && template.resources.length > 0) {
                try {
                    const result = await fetchAPI('/api/preview-resources', 'POST', {
                        template: template.id,
                        name: defaultName,
                        vars: template.vars || {}
                    });
                    if (result) {
                        previewedResources = result;
                    }
                } catch (e) {
                    console.warn('Failed to preview resources:', e);
                    // Keep previewedResources as empty object
                }
            }

            // Extract all variables from command and template
            // BUT exclude resources (they go in their own section)
            const resourceSet = new Set(template.resources || []);
            const allVars = new Set(Object.keys(template.vars || {}));
            const commandVars = (template.command.match(/\${([^}]+)}/g) || []).map(m => m.slice(2, -1));
            commandVars.forEach(v => {
                // Only add if it's not a resource
                if (!resourceSet.has(v)) {
                    allVars.add(v);
                }
            });

            // Build the dialog HTML
            let html = '<div class="flex flex-col gap-4" style="max-height: 60vh; overflow-y: auto;">';

            // Instance Name
            html += `
                <div>
                    <label class="block text-sm font-semibold mb-2">Instance Name</label>
                    <input type="text" id="launch-name" class="input w-full" placeholder="Enter instance name" value="${template.id}-instance">
                </div>
            `;

            // Variables Section (excluding resources)
            if (allVars.size > 0) {
                html += '<div><div class="text-xs font-bold text-muted uppercase mb-2">Variables</div>';
                allVars.forEach(varName => {
                    const defaultValue = template.vars?.[varName] || '';
                    html += `
                        <div class="mb-3">
                            <label class="block text-xs text-muted mb-1">${varName}</label>
                            <input type="text" id="var-${varName}" class="input w-full" value="${escapeHtml(defaultValue)}" placeholder="Enter ${varName}" oninput="updateCommandPreview('${template.id}')">
                        </div>
                    `;
                });
                html += '</div>';
            }

            // Resources Section
            if (template.resources && template.resources.length > 0) {
                html += '<div><div class="text-xs font-bold text-muted uppercase mb-2">Required Resources</div>';
                template.resources.forEach(res => {
                    const previewedValue = previewedResources[res] || '';
                    const placeholder = previewedValue ? `Allocated: ${previewedValue}` : 'Auto-allocate';

                    html += `
                        <div class="mb-3">
                            <label class="block text-xs text-muted mb-1">${res}</label>
                            <input type="text" id="res-${res}" class="input w-full" placeholder="${placeholder}" value="${previewedValue}" oninput="updateCommandPreview('${template.id}')">
                            <p class="text-xs text-muted mt-1">Editable - cached for 60 seconds</p>
                        </div>
                    `;
                });
                html += '</div>';
            }

            // Command Preview Section
            html += `
                <div>
                    <div class="text-xs font-bold text-muted uppercase mb-2 flex justify-between items-center">
                        <span>Command Preview</span>
                        <button onclick="updateCommandPreview('${template.id}')" class="btn btn-outline btn-sm" style="height: 1.5rem; font-size: 0.65rem; padding: 0 0.5rem;">Update</button>
                    </div>
                    <textarea id="launch-command" class="input w-full font-mono text-xs" style="resize: vertical; padding: 0.5rem; min-height: 120px; height: auto; overflow-y: auto; white-space: pre-wrap; word-wrap: break-word;">${escapeHtml(template.command)}</textarea>
                    <p class="text-xs text-muted mt-1">Edit the final command before launch</p>
                </div>
            `;

            html += '</div>';

            // Store template data for the dialog
            window._currentLaunchTemplate = template;

            showModal(`Launch: ${template.label || template.id}`, html, [
                { text: 'Cancel', class: 'btn-outline', onclick: 'closeModal()' },
                { text: 'Launch', class: 'btn-primary', onclick: 'executeLaunch()' }
            ]);

            // Initial command update
            setTimeout(() => updateCommandPreview(template.id), 100);
        }

        function updateCommandPreview(templateId) {
            const template = window._currentLaunchTemplate;
            if (!template) return;

            let cmd = template.command;

            // Replace all variables
            const allVars = new Set(Object.keys(template.vars || {}));
            const commandVars = (template.command.match(/\${([^}]+)}/g) || []).map(m => m.slice(2, -1));
            commandVars.forEach(v => allVars.add(v));

            allVars.forEach(varName => {
                const input = document.getElementById(`var-${varName}`);
                if (input) {
                    const value = input.value;
                    cmd = cmd.replace(new RegExp('\\$\\{' + varName + '\\}', 'g'), value);
                }
            });

            // Replace all resources
            if (template.resources) {
                template.resources.forEach(resType => {
                    const input = document.getElementById(`res-${resType}`);
                    if (input) {
                        const value = input.value;
                        cmd = cmd.replace(new RegExp('\\$\\{' + resType + '\\}', 'g'), value);
                    }
                });
            }

            // Update the command textarea
            const commandField = document.getElementById('launch-command');
            if (commandField) {
                commandField.value = cmd;
            }
        }

        async function executeLaunch() {
            const template = window._currentLaunchTemplate;
            if (!template) return;

            const name = document.getElementById('launch-name').value.trim();
            if (!name) {
                alert('Please enter an instance name');
                return;
            }

            // Collect variables
            const vars = {};
            const allVars = new Set(Object.keys(template.vars || {}));
            const commandVars = (template.command.match(/\${([^}]+)}/g) || []).map(m => m.slice(2, -1));
            commandVars.forEach(v => allVars.add(v));

            allVars.forEach(varName => {
                const input = document.getElementById(`var-${varName}`);
                if (input) {
                    vars[varName] = input.value;
                }
            });

            // Collect resource overrides (only if specified)
            if (template.resources) {
                template.resources.forEach(res => {
                    const input = document.getElementById(`res-${res}`);
                    if (input && input.value.trim()) {
                        vars[res] = input.value.trim();
                    }
                });
            }

            // Inject special ${host} variable
            if (!vars.host) {
                vars.host = config.host;
            }

            // Get the final edited command
            const finalCommand = document.getElementById('launch-command').value;

            // If command was edited, we need to handle it differently
            // For now, we'll use the vars approach and let the backend interpolate
            // In the future, we could add an API endpoint that accepts a raw command

            await fetchAPI('/api/instances', 'POST', {
                action: 'start',
                template: template.id,
                name,
                vars
            });

            closeModal();
            await loadInstances();
            setTab('instances');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function addAsTemplate(instanceId) {
            const i = state.instances[instanceId];
            if (!i) return;
            const id = prompt('Template ID:', i.name + '-template');
            if (!id) return;

            const t = {
                id,
                label: 'Template from ' + i.name,
                command: i.command,
                resources: Object.keys(i.resources || {}),
                vars: i.vars || {}
            };
            await fetchAPI('/api/templates', 'POST', t);
            loadTemplates();
        }

        async function stopProcess(pid) {
            if (!confirm(`Stop process ${pid}?`)) return;
            try {
                const result = await fetch(config.targetHost + '/api/kill-process', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        ...(config.targetApiKey ? { 'X-VP-Key': config.targetApiKey } : {})
                    },
                    body: JSON.stringify({ pid })
                });
                if (result.ok) {
                    discoverProcesses();
                } else {
                    alert('Failed to stop process');
                }
            } catch (e) {
                alert('Error stopping process: ' + e.message);
            }
        }

        async function monitorProcess(pid, cmd) {
            const name = prompt('Name:', cmd.split(' ')[0].split('/').pop() + '-' + pid);
            if (name) {
                await fetchAPI('/api/monitor', 'POST', { pid, name });
                await loadInstances();
                setTab('instances');
            }
        }

        function addTemplate() {
            const json = prompt('Template JSON:');
            if (json) fetchAPI('/api/templates', 'POST', JSON.parse(json)).then(loadTemplates);
        }

        function addResourceType() {
            const name = prompt('Type Name:');
            if (!name) return;
            const check = prompt('Check command (optional):');
            const counter = confirm('Is counter?');
            let start = 0, end = 0;
            if (counter) {
                start = parseInt(prompt('Start:')) || 0;
                end = parseInt(prompt('End:')) || 0;
            }
            fetchAPI('/api/resource-types', 'POST', { name, check, counter, start, end }).then(loadResourceTypes);
        }

        // Helper to interpolate variables in commands (including ${host} and resources)
        function interpolateCommand(cmd, instance) {
            if (!cmd) return cmd;
            let result = cmd;

            // Replace special ${host} variable
            result = result.replace(/\$\{host\}/g, config.host);

            // Replace resource variables from instance
            if (instance && instance.resources) {
                Object.entries(instance.resources).forEach(([k, v]) => {
                    result = result.replace(new RegExp('\\$\\{' + k + '\\}', 'g'), v);
                });
            }

            return result;
        }

        // Legacy helper - kept for compatibility
        function interpolateHost(cmd) {
            if (!cmd) return cmd;
            return cmd.replace(/\$\{host\}/g, config.host);
        }

        // Launchers
        function showLaunchers(instanceId, event) {
            const i = state.instances[instanceId];
            if (!i) return;

            const launchers = i.launchers || {};
            const launcherKeys = Object.keys(launchers);
            const hasAction = !!i.action;

            // Check for template launchers
            const tmpl = state.templates[i.template];
            const tmplLaunchers = {};
            if (tmpl && tmpl.launchers) {
                Object.entries(tmpl.launchers).forEach(([key, cmd]) => {
                    if (!launchers[key]) {
                        // Interpolate
                        let finalCmd = cmd;
                        // Replace special ${host} variable
                        finalCmd = finalCmd.replace(/\$\{host\}/g, config.host);
                        // Replace vars from template defaults
                        if (tmpl.vars) {
                            Object.entries(tmpl.vars).forEach(([k, v]) => {
                                finalCmd = finalCmd.replace(new RegExp('\\${' + k + '}', 'g'), v);
                            });
                        }
                        // Replace resources from instance
                        if (i.resources) {
                            Object.entries(i.resources).forEach(([k, v]) => {
                                finalCmd = finalCmd.replace(new RegExp('\\${' + k + '}', 'g'), v);
                            });
                        }
                        tmplLaunchers[key] = finalCmd;
                    }
                });
            }

            const tmplKeys = Object.keys(tmplLaunchers);
            const totalOptions = launcherKeys.length + tmplKeys.length + (hasAction ? 1 : 0);

            // Logic:
            // If just click (no shift) AND exactly one option -> Launch it
            // Else -> Show menu

            if (!event.shiftKey && totalOptions === 1) {
                if (hasAction) {
                    executeAction(i.name, interpolateCommand(i.action, i));
                } else if (launcherKeys.length > 0) {
                    executeAction(i.name, interpolateCommand(launchers[launcherKeys[0]], i));
                } else if (tmplKeys.length > 0) {
                    executeAction(i.name, tmplLaunchers[tmplKeys[0]]);
                }
                return;
            }

            if (totalOptions === 0) {
                showModal(i.name, `<p class="text-muted">No launchers defined for this instance.</p>`);
                return;
            }

            let html = '<div class="flex flex-col gap-4">';

            if (hasAction) {
                const interpolatedAction = interpolateCommand(i.action, i);
                html += `<div>
                    <div class="text-xs font-bold text-muted uppercase mb-2">Default Action</div>
                    <button onclick="executeAction('${i.name}', '${escapeQuotes(interpolatedAction)}'); closeModal()" class="btn btn-primary w-full justify-between">
                        <span>Default Action</span>
                        <span class="text-xs opacity-75">↗</span>
                    </button>
                </div>`;
            }

            if (launcherKeys.length > 0) {
                html += `<div>
                    <div class="text-xs font-bold text-muted uppercase mb-2">Instance Launchers</div>
                    <div class="flex flex-col gap-2">
                        ${Object.entries(launchers).map(([label, cmd]) => {
                            const interpolatedCmd = interpolateCommand(cmd, i);
                            return `
                        <button onclick="executeAction('${i.name}', '${escapeQuotes(interpolatedCmd)}'); closeModal()" class="btn btn-outline flex-col items-start h-auto py-2 gap-1 w-full">
                            <span class="font-bold">${label}</span>
                            <span class="text-xs text-muted font-mono text-left break-all whitespace-normal opacity-75">${interpolatedCmd}</span>
                        </button>
                        `;}).join('')}
                    </div>
                </div>`;
            }

            if (tmplKeys.length > 0) {
                html += `<div>
                    <div class="text-xs font-bold text-muted uppercase mb-2">Template Launchers</div>
                    <div class="flex flex-col gap-2">
                        ${Object.entries(tmplLaunchers).map(([label, cmd]) => `
                        <button onclick="executeAction('${i.name}', '${escapeQuotes(cmd)}'); closeModal()" class="btn btn-outline flex-col items-start h-auto py-2 gap-1 w-full">
                            <span class="font-bold">${label}</span>
                            <span class="text-xs text-muted font-mono text-left break-all whitespace-normal opacity-75">${cmd}</span>
                        </button>
                        `).join('')}
                    </div>
                </div>`;
            }

            html += '</div>';
            showModal(`Launch ${i.name}`, html);
        }

        async function executeAction(instanceName, action) {
            // Check if action is a URL
            const urlPattern = /^(https?:\/\/|http:\/\/)/i;
            if (urlPattern.test(action)) {
                window.open(action, '_blank');
            } else {
                // Execute command via API (goes to target host)
                try {
                    await fetchAPI('/api/execute-action', 'POST', {
                        instance_name: instanceName,
                        action: action
                    });
                } catch (err) {
                    alert('Error executing action: ' + err.message);
                }
            }
        }

        // Modal Utils
        function showModal(title, body, buttons = null) {
            document.getElementById('modal-header').textContent = title;
            document.getElementById('modal-body').innerHTML = body;

            // Setup footer buttons
            const footer = document.getElementById('modal-footer');
            if (buttons) {
                footer.innerHTML = buttons.map(btn =>
                    `<button onclick="${btn.onclick}" class="btn ${btn.class || 'btn-outline'}">${btn.text}</button>`
                ).join('');
            } else {
                footer.innerHTML = '<button onclick="closeModal()" class="btn btn-outline">Close</button>';
            }

            document.getElementById('modal-overlay').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
            // Keep waitingForAuth true if user cancels without entering a key
            // This prevents modal spam on every auto-refresh
        }

        // Utils
        function formatTime(s) {
            if (!s) return '-';
            if (s < 60) return s.toFixed(1) + 's';
            return (s / 60).toFixed(1) + 'm';
        }
        function truncate(s, n) {
            if (!s || s.length <= n) return s;
            return s.substring(0, n) + '...';
        }
        function escapeQuotes(s) { return s.replace(/'/g, "\\'"); }

        // Loop
        setInterval(() => {
            const now = Date.now();
            const auto = document.getElementById('auto-refresh').checked;
            const visible = !document.hidden;

            // Update Counters
            ['instances', 'discover'].forEach(key => {
                const last = state.lastUpdate[key];
                const elDot = document.getElementById(`status-${key}`);
                const elLabel = document.getElementById(`label-${key}`);
                const elTime = document.getElementById(`time-${key}`);
                if (!elDot) return;

                if (last === 0) {
                    elDot.className = 'status-dot stale';
                    elLabel.textContent = 'Not loaded';
                    elTime.textContent = '';
                } else {
                    const age = (now - last) / 1000;
                    if (age < 6) {
                        elDot.className = 'status-dot live';
                        elLabel.textContent = 'Live';
                        elTime.textContent = ` (${age.toFixed(0)}s)`;
                    } else {
                        elDot.className = 'status-dot stale';
                        elLabel.textContent = 'Stale';
                        elTime.textContent = ` (${age.toFixed(0)}s)`;
                    }
                }
            });


            // Auto Refresh - but don't spam API if waiting for auth
            if (auto && visible && !state.waitingForAuth) {
                if (state.activeTab === 'instances' && (now - state.lastUpdate.instances > 1000)) loadInstances();
                if (state.activeTab === 'discover' && (now - state.lastUpdate.discover > 2000)) discoverProcesses();
            }
        }, 1000);

        // Init
        checkInitialSetup();
        // Don't call loadInstances() here - checkInitialSetup() will show settings if needed
        // After user enters valid key, saveSettings() will trigger the first load
    </script>
</body>

</html>
